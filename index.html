<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpaqa — Console Gaming</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5c800;
    --surface: #e8b800;
    --surface2: #d4a800;
    --border: #c49a00;
    --accent-a: #1a3a8f;
    --accent-dark: #0f2566;
    --text: #0f2566;
    --muted: #4a6abf;
    --card-bg: #f5c800;
    --card-border: #c49a00;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, rgba(0,0,0,0.06) 1px, transparent 1px);
    background-size: 18px 18px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    padding: 3rem 2rem 2rem;
    text-align: center;
    width: 100%;
    border-bottom: 2px solid var(--card-border);
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: -60px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 300px;
    background: radial-gradient(ellipse, rgba(26,58,143,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .tagline {
    margin-top: 0.5rem;
    color: var(--accent-a);
    font-size: 0.95rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 600;
    opacity: 0.75;
  }

  /* LANG SELECTOR */
  .lang-wrap {
    position: absolute;
    top: 1rem;
    right: 1rem;
    z-index: 10;
  }

  .lang-select {
    background: var(--accent-a);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    padding: 0.4rem 0.7rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.05em;
    outline: none;
  }

  .lang-select option { background: var(--accent-a); color: var(--bg); }

  /* NAV */
  nav {
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 0;
    border-bottom: 2px solid var(--card-border);
    background: var(--surface);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .nav-btn {
    padding: 0.9rem 1rem;
    background: none;
    border: none;
    border-right: 1px solid var(--card-border);
    color: var(--accent-a);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    opacity: 0.7;
    white-space: nowrap;
    flex: 1;
  }

  .nav-btn:last-child { border-right: none; }
  .nav-btn:hover { background: var(--surface2); opacity: 1; }
  .nav-btn.active { background: var(--accent-a); color: var(--bg); opacity: 1; }

  .page { display: none; }
  .page.active { display: block; }

  .main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    padding: 3rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    border-radius: 6px;
    overflow: hidden;
    animation: fadeUp 0.5s ease both;
  }

  .card-header {
    padding: 1.75rem 2rem 1.5rem;
    border-bottom: 2px solid var(--card-border);
    text-align: center;
    background: linear-gradient(180deg, rgba(26,58,143,0.05) 0%, transparent 100%);
  }

  .build-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.4rem;
    letter-spacing: 0.1em;
    color: var(--accent-a);
    line-height: 1;
  }

  .build-subtitle {
    margin-top: 0.4rem;
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
  }

  .price-row {
    padding: 1.1rem 2rem;
    border-bottom: 2px solid var(--card-border);
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0.5rem;
    background: rgba(26,58,143,0.05);
  }

  .price {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.8rem;
    letter-spacing: 0.06em;
    color: var(--accent-a);
  }

  .price-label {
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }

  .components { padding: 1.25rem 2rem; }

  .component-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0.6rem 0;
    border-bottom: 1px solid rgba(26,58,143,0.1);
    gap: 1rem;
  }

  .component-row:last-child { border-bottom: none; }

  .comp-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    flex-shrink: 0;
  }

  .comp-value {
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text);
    text-align: right;
  }

  .perf-section {
    padding: 1.25rem 2rem 1.75rem;
    border-top: 2px solid var(--card-border);
    background: rgba(26,58,143,0.04);
  }

  .perf-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 1rem;
    font-weight: 700;
  }

  .perf-bar-wrap {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.65rem;
  }

  .perf-bar-wrap:last-child { margin-bottom: 0; }

  .perf-game {
    font-size: 0.8rem;
    color: var(--text);
    font-weight: 600;
    width: 85px;
    flex-shrink: 0;
  }

  .perf-bar-bg {
    flex: 1;
    height: 6px;
    background: rgba(26,58,143,0.12);
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid rgba(26,58,143,0.15);
  }

  .perf-bar-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--accent-a);
    animation: growBar 1s cubic-bezier(0.16,1,0.3,1) both;
    animation-delay: 0.3s;
  }

  @keyframes growBar { from { width: 0 !important; } }

  .perf-fps {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--accent-a);
    font-weight: 700;
    width: 55px;
    text-align: right;
    flex-shrink: 0;
  }

  .specs-toggle {
    width: 100%;
    padding: 1.1rem 2rem;
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: color 0.2s;
    font-weight: 700;
  }

  .specs-toggle:hover { color: var(--accent-a); }
  .specs-arrow { font-size: 0.6rem; transition: transform 0.3s; }

  .specs-body {
    display: none;
    padding: 0 2rem 1rem;
    border-top: 1px solid rgba(26,58,143,0.15);
  }

  .specs-body.open { display: block; }

  .media-title {
    padding: 1.25rem 2rem;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.08em;
    color: var(--accent-a);
    border-bottom: 2px solid var(--card-border);
  }

  .media-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }

  .media-item {
    position: relative;
    aspect-ratio: 16/9;
    overflow: hidden;
    border-right: 1px solid var(--card-border);
    border-bottom: 1px solid var(--card-border);
  }

  .media-item:nth-child(even) { border-right: none; }
  .media-item:nth-last-child(-n+2) { border-bottom: none; }

  .media-item iframe {
    width: 100%; height: 100%;
    display: block;
  }

  .media-item .game-label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 0.4rem 0.7rem;
    background: linear-gradient(transparent, rgba(15,37,102,0.85));
    color: #fff;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .section-title {
    padding: 1.25rem 2rem;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.08em;
    color: var(--accent-a);
    border-bottom: 2px solid var(--card-border);
  }

  .perks-list { padding: 0.5rem 0; background: var(--surface); }

  .perk-item {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    padding: 1rem 2rem;
    border-bottom: 1px solid rgba(26,58,143,0.08);
  }

  .perk-item:last-child { border-bottom: none; }
  .perk-icon { font-size: 1.3rem; flex-shrink: 0; margin-top: 0.1rem; }

  .perk-text strong {
    display: block;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 0.2rem;
  }

  .perk-text p { font-size: 0.82rem; color: var(--muted); line-height: 1.5; }

  .faq-list { padding: 0.5rem 0; }
  .faq-item { border-bottom: 1px solid rgba(26,58,143,0.1); }
  .faq-item:last-child { border-bottom: none; }

  .faq-question {
    width: 100%;
    padding: 1rem 2rem;
    background: none;
    border: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    transition: color 0.2s;
  }

  .faq-question:hover { color: var(--accent-a); }
  .faq-arrow { font-size: 0.6rem; transition: transform 0.3s; flex-shrink: 0; }

  .faq-answer {
    display: none;
    padding: 0 2rem 1rem;
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.6;
  }

  .faq-answer.open { display: block; }

  .about-body {
    padding: 1.5rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .about-placeholder {
    font-size: 0.88rem;
    color: var(--muted);
    line-height: 1.7;
    padding: 1rem;
    border: 1px dashed var(--card-border);
    border-radius: 4px;
    background: rgba(26,58,143,0.03);
  }

  .contact-body {
    padding: 1.5rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .contact-body input,
  .contact-body textarea {
    background: #fff;
    border: 2px solid var(--card-border);
    border-radius: 4px;
    padding: 0.75rem 1rem;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    width: 100%;
    transition: border-color 0.2s;
    outline: none;
    resize: none;
  }

  .contact-body input::placeholder,
  .contact-body textarea::placeholder { color: var(--muted); }

  .contact-body input:focus,
  .contact-body textarea:focus { border-color: var(--accent-a); }

  .send-btn {
    padding: 0.9rem;
    background: var(--accent-a);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
  }

  .send-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .send-btn:active { transform: translateY(0); }

  .success-msg {
    display: none;
    text-align: center;
    color: var(--accent-a);
    font-size: 0.88rem;
    padding: 0.5rem 0;
    font-weight: 700;
  }

  footer {
    position: relative;
    z-index: 1;
    width: 100%;
    border-top: 2px solid var(--card-border);
    padding: 1.75rem 2rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    font-weight: 600;
    background: var(--surface);
  }

  footer span { color: var(--accent-a); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--accent-a); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="lang-wrap">
    <select class="lang-select" onchange="setLang(this.value)">
      <option value="it">🇮🇹 Italiano</option>
      <option value="en">🇬🇧 English</option>
      <option value="es">🇪🇸 Español</option>
    </select>
  </div>
  <img src="LogoAlpaqa.png" alt="Alpaqa" style="height: clamp(140px, 28vw, 260px); width: auto; display: block; margin: 0 auto;">
  <p class="tagline" data-i18n="tagline"></p>
</header>

<nav>
  <button class="nav-btn active" onclick="showPage('home')" data-i18n="nav_home"></button>
  <button class="nav-btn" onclick="showPage('about')" data-i18n="nav_about"></button>
  <button class="nav-btn" onclick="showPage('faq')" data-i18n="nav_faq"></button>
  <button class="nav-btn" onclick="showPage('contact')" data-i18n="nav_buy"></button>
</nav>

<!-- ======================== HOME ======================== -->

<div class="main">

  <div class="card" style="animation-delay:0s">
    <div class="card-header">
      <div class="build-name">Alpaqa Uno</div>
      <div class="build-subtitle" data-i18n="console_gaming"></div>

    </div>
    <div class="price-row">
      <span class="price">599€</span>
      <span class="price-label" data-i18n="ref_price"></span>

    <div class="components">
      <div class="component-row">
        <span class="comp-label">Storage</span>
        <span class="comp-value">SSD 1TB</span>
      </div>
    </div>
    <div class="perf-section">
      <div class="perf-title" data-i18n="fps_title"></div>
      <div class="perf-bar-wrap">
        <span class="perf-game">Fortnite</span>

        <span class="perf-game">GTA V</span>

        <span class="perf-game">FC 26</span>

        <iframe src="https://www.youtube.com/embed/NXTlh31ZWZ4" frameborder="0" allowfullscreen></iframe>

      <div class="media-item">

        <div class="game-label">FC 26</div>
      </div>
      <div class="media-item">
        <iframe src="https://www.youtube.com/embed/E3Huy2cdih0" frameborder="0" allowfullscreen></iframe>
        <div class="game-label">Elden Ring</div>
      </div>
    </div>
  </div>

  <div class="card" style="animation-delay:0.2s">
    <div class="section-title" data-i18n="why_alpaqa"></div>
    <div class="perks-list">
      <div class="perk-item">
        <div class="perk-icon">🎮</div>
        <div class="perk-text">
          <strong data-i18n="perk1_title"></strong>
          <p data-i18n="perk1_desc"></p>
        </div>
      </div>
      <div class="perk-item">
        <div class="perk-icon">🌐</div>
        <div class="perk-text">
          <strong data-i18n="perk2_title"></strong>
          <p data-i18n="perk2_desc"></p>

      </div>
      <div class="perk-item">
        <div class="perk-icon">🔓</div>
        <div class="perk-text">
          <strong data-i18n="perk3_title"></strong>
          <p data-i18n="perk3_desc"></p>

      <div class="perk-item">
        <div class="perk-icon">⚡</div>

          <strong data-i18n="perk4_title"></strong>

</div>

<div class="main">
  <div class="card" style="animation-delay:0s">

    <div class="about-body">

<!-- ======================== FAQ ======================== -->
<div class="page" id="page-faq">

<!-- ======================== ACQUISTA ======================== -->
<div class="page" id="page-contact">
<div class="main">
  <div class="card" style="animation-delay:0s">
    <div class="section-title" data-i18n="buy_title"></div>
    <div class="contact-body">
      <input type="text" id="contactName" data-i18n-placeholder="placeholder_name" />
      <input type="email" id="contactEmail" data-i18n-placeholder="placeholder_email" />
      <textarea id="contactMsg" rows="4" data-i18n-placeholder="placeholder_msg"></textarea>
      <button class="send-btn" onclick="sendEmail()" data-i18n="send_btn"></button>

    </div>
  </div>

  <span>Alpaqa</span> — Console Gaming

<script>

let currentLang = 'it';

function setLang(lang) {
  currentLang = lang;
  const t = i18n[lang];

  // update all data-i18n elements
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.textContent = t[key];
  });

  // update placeholders
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (t[key] !== undefined) el.placeholder = t[key];
  });

  // update social section separately (contains HTML)
  const socialEl = document.getElementById('about-social');
  if (socialEl) {
    socialEl.innerHTML = `${t.about_social}<br><br>
      <a href="#" style="color:var(--accent-a);font-weight:700;margin-right:1rem;text-decoration:none;">YouTube</a>
      <a href="#" style="color:var(--accent-a);font-weight:700;margin-right:1rem;text-decoration:none;">Instagram</a>
      <a href="#" style="color:var(--accent-a);font-weight:700;margin-right:1rem;text-decoration:none;">Facebook</a>
      <a href="#" style="color:var(--accent-a);font-weight:700;margin-right:1rem;text-decoration:none;">X</a>
      <a href="#" style="color:var(--accent-a);font-weight:700;text-decoration:none;">LinkedIn</a>`;
  }

  document.documentElement.lang = lang;
}

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  event.target.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleSpecs() {
  const body = document.getElementById('specsBody');
  const arrow = document.getElementById('specsArrow');
  body.classList.toggle('open');
  arrow.style.transform = body.classList.contains('open') ? 'rotate(180deg)' : '';
}

function toggleFaq(btn) {
  const answer = btn.nextElementSibling;
  const arrow = btn.querySelector('.faq-arrow');
  const isOpen = answer.classList.contains('open');
  document.querySelectorAll('.faq-answer').forEach(a => a.classList.remove('open'));
  document.querySelectorAll('.faq-arrow').forEach(a => a.style.transform = '');
  if (!isOpen) {
    answer.classList.add('open');
    arrow.style.transform = 'rotate(180deg)';
  }
}

const FORMSPREE_ENDPOINT = "https://formspree.io/f/mnjyolgl";

async function sendEmail() {
  const t = i18n[currentLang];
  const name    = document.getElementById('contactName').value.trim();
  const replyTo = document.getElementById('contactEmail').value.trim();
  const msg     = document.getElementById('contactMsg').value.trim();

  if (!name || !msg) { alert(t.alert_fields); return; }
  if (!FORMSPREE_ENDPOINT) { alert(t.alert_endpoint); return; }

  const btn = document.querySelector('.send-btn');
  btn.textContent = t.sending;
  btn.disabled = true;

  try {
    const response = await fetch(FORMSPREE_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ name, email: replyTo, message: msg })
    });

    if (response.ok) {
      document.getElementById('successMsg').style.display = 'block';
      document.getElementById('contactName').value = '';
      document.getElementById('contactEmail').value = '';
      document.getElementById('contactMsg').value = '';
      btn.textContent = t.sent;
    } else {
      alert(t.alert_error);
      btn.textContent = i18n[currentLang].send_btn;
      btn.disabled = false;
    }
  } catch (e) {
    alert(t.alert_conn);
    btn.textContent = i18n[currentLang].send_btn;
    btn.disabled = false;
  }
}

// init default language
setLang('it');
